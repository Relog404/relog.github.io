name: Build CS2 plugin

on:
  # триггерится на любой ветке: так сборка работает и в PR, и в рабочей ветке
  push:
    paths:
      - 'cs2-server/plugins/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'cs2-server/plugins/**'
      - '.github/workflows/build-plugin.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      css_version:
        description: 'Версия CounterStrikeSharp (пусто = последняя)'
        required: false
        default: ''
      commit_dll:
        description: 'Закоммитить готовую DLL обратно в ветку'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Сборка PanelSkins (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Собрать плагин
        id: build
        run: |
          set -uo pipefail
          cd cs2-server/plugins/PanelSkins
          rm -f build.log
          dotnet build -c Release 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Сложить готовые файлы
        run: |
          set -euo pipefail
          out=cs2-server/plugins/PanelSkins/dist
          mkdir -p "$out"
          bin=$(find cs2-server/plugins/PanelSkins/bin/Release -name 'PanelSkins.dll' | head -1)
          echo "собралось: $bin"
          cp "$bin" "$out/"
          cp "$(dirname "$bin")/PanelSkins.deps.json" "$out/" 2>/dev/null || true
          cp cs2-server/plugins/PanelSkins/config.example.json "$out/PanelSkins.json.example"
          cp cs2-server/plugins/PanelSkins/gamedata/panelskins.json "$out/"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: PanelSkins
          path: cs2-server/plugins/PanelSkins/dist/
          if-no-files-found: error

      - name: Приложить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cs2-server/plugins/PanelSkins/dist
          gh release upload "${{ github.event.release.tag_name }}" PanelSkins.dll PanelSkins.deps.json PanelSkins.json.example panelskins.json --clobber

      # Готовая DLL уезжает в репозиторий: чтобы ставить плагин без .NET SDK.
      - name: Закоммитить DLL в ветку
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_dll)
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cs2-server/plugins/PanelSkins/dist
          if git diff --cached --quiet; then
            echo "DLL не изменилась — коммитить нечего"
            exit 0
          fi
          git commit -m "chore: обновить готовую сборку PanelSkins [skip ci]"
          git push
