name: Build CS2 plugin

on:
  # триггерится на любой ветке: так сборка работает и в PR, и в рабочей ветке
  push:
    paths:
      - 'cs2-server/plugins/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'cs2-server/plugins/**'
      - '.github/workflows/build-plugin.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      css_version:
        description: 'Версия CounterStrikeSharp (пусто = последняя)'
        required: false
        default: ''
      commit_dll:
        description: 'Закоммитить готовую DLL обратно в ветку'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Сборка PanelSkins (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Ссылаемся на те же DLL, что реально лежат на сервере:
      # скачиваем официальный релиз CounterStrikeSharp.
      - name: Скачать CounterStrikeSharp
        id: css
        run: |
          set -euo pipefail
          version="${{ inputs.css_version }}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL https://api.github.com/repos/roflmuffin/CounterStrikeSharp/releases/latest \
              | grep '"tag_name"' | head -1 | sed 's/.*"v\?\([0-9.]*\)".*/\1/')
          fi
          echo "версия CSSharp: $version"
          url="https://github.com/roflmuffin/CounterStrikeSharp/releases/download/v${version}/counterstrikesharp-windows-${version}.zip"
          mkdir -p .cssharp
          if curl -fsSL -o .cssharp/css.zip "$url"; then
            (cd .cssharp && unzip -q css.zip)
            shared=$(find .cssharp -type d -name shared -path '*counterstrikesharp*' | head -1)
            api=$(find .cssharp -name 'CounterStrikeSharp.API.dll' | head -1)
            if [ -n "$api" ]; then
              echo "refs=$(dirname "$api")/" >> "$GITHUB_OUTPUT"
              echo "версия=$version" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "скачать не вышло — соберём из NuGet"
          echo "refs=" >> "$GITHUB_OUTPUT"

      - name: Собрать плагин
        id: build
        run: |
          set -uo pipefail
          cd cs2-server/plugins/PanelSkins
          rm -f build.log
          if [ -n "${{ steps.css.outputs.refs }}" ]; then
            echo "== сборка по DLL из релиза CSSharp ==" | tee -a build.log
            dotnet build -c Release -p:CSSharpRefs="${{ steps.css.outputs.refs }}" 2>&1 | tee -a build.log
            if [ -f bin/Release/net8.0/PanelSkins.dll ]; then exit ${PIPESTATUS[0]}; fi
          fi
          echo "== сборка из NuGet ==" | tee -a build.log
          dotnet build -c Release 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Сохранить лог сборки в репозиторий
        if: failure()
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          cp cs2-server/plugins/PanelSkins/build.log cs2-server/plugins/PanelSkins/build.log 2>/dev/null || true
          git add cs2-server/plugins/PanelSkins/build.log
          git diff --cached --quiet || git commit -m "ci: лог неудачной сборки плагина [skip ci]"
          git push

      - name: Сложить готовые файлы
        run: |
          set -euo pipefail
          out=cs2-server/plugins/PanelSkins/dist
          mkdir -p "$out"
          cp cs2-server/plugins/PanelSkins/bin/Release/net8.0/PanelSkins.dll "$out/"
          [ -f cs2-server/plugins/PanelSkins/bin/Release/net8.0/PanelSkins.deps.json ] \
            && cp cs2-server/plugins/PanelSkins/bin/Release/net8.0/PanelSkins.deps.json "$out/" || true
          cp cs2-server/plugins/PanelSkins/config.example.json "$out/PanelSkins.json.example"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: PanelSkins
          path: cs2-server/plugins/PanelSkins/dist/
          if-no-files-found: error

      - name: Приложить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cs2-server/plugins/PanelSkins/dist
          gh release upload "${{ github.event.release.tag_name }}" PanelSkins.dll PanelSkins.deps.json PanelSkins.json.example --clobber

      # Готовая DLL уезжает в репозиторий: чтобы ставить плагин без .NET SDK.
      - name: Закоммитить DLL в ветку
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_dll)
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cs2-server/plugins/PanelSkins/dist
          if git diff --cached --quiet; then
            echo "DLL не изменилась — коммитить нечего"
            exit 0
          fi
          git commit -m "chore: обновить готовую сборку PanelSkins [skip ci]"
          git push
