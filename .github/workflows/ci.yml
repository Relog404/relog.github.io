name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  panel:
    name: Panel (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Smoke check (boot panel, hit /api/health)
        env:
          PORT: 3111
          DEMO_MODE: '1'
          SESSION_SECRET: ci-secret
          ADMIN_STEAM_IDS: '76561190000000001'
        run: |
          node src/server.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3111/api/health; then echo; exit 0; fi
            sleep 1
          done
          echo "panel did not start in time" >&2
          exit 1

  windows-scripts:
    name: Windows-скрипты (CRLF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .bat/.cmd/.ps1 должны быть с CRLF
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if 'node_modules' in p.parts or not p.is_file():
                  continue
              if p.suffix.lower() in ('.bat', '.cmd', '.ps1') and b'\r\n' not in p.read_bytes():
                  bad.append(str(p))
          if bad:
              print('LF-only — cmd на Windows такие файлы не выполняет:', *bad, sep='\n  ')
              sys.exit(1)
          print('все Windows-скрипты с CRLF')
          PY

      - name: ".bat: метки существуют, окно не закроется само, вывод не в пайп"
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          bad = []
          for p in sorted(pathlib.Path('.').rglob('*.bat')):
              if 'node_modules' in p.parts:
                  continue
              raw = p.read_bytes()
              text = raw.decode('utf-8')
              lines = text.replace('\r\n', '\n').split('\n')

              labels = set()
              for line in lines:
                  m = re.match(r'^:([A-Za-z0-9_\-]+)\s*$', line.strip())
                  if m:
                      labels.add(m.group(1).lower())
              for line in lines:
                  if line.strip().lower().startswith('rem'):
                      continue
                  for m in re.finditer(r'\bgoto\s+:?([A-Za-z0-9_\-]+)|\bcall\s+:([A-Za-z0-9_\-]+)', line, re.I):
                      name = (m.group(1) or m.group(2)).lower()
                      if name in labels or name == 'eof':
                          continue
                      bad.append(f'{p}: переход на несуществующую метку :{name}')

              if 'CS2BAT_GUARD' not in text:
                  bad.append(f'{p}: нет страховки cmd /k — окно может закрыться молча')
              if re.search(r'\|\s*powershell', text, re.I):
                  bad.append(f'{p}: вывод уходит в пайп powershell — сбой пайпа гасит окно без следа')
              if not text.startswith('@echo off'):
                  bad.append(f'{p}: первая строка должна быть @echo off')
              if b'\r\n' not in raw:
                  bad.append(f'{p}: файл с переводами LF — cmd на Windows закрывается сам')

          for p in sorted(pathlib.Path('.').rglob('*.ps1')):
              if 'node_modules' in p.parts:
                  continue
              if re.search(r'(?<!`)\\r\\n', p.read_bytes().decode('utf-8-sig')):
                  bad.append(f'{p}: в PowerShell "\\r\\n" не раскрывается — нужны обратные кавычки')

          if bad:
              print('ПРОБЛЕМЫ В Windows-скриптах:', *bad, sep='\n  ')
              sys.exit(1)
          print('Windows-скрипты: метки, страховка от закрытия окна, CRLF — в порядке')
          PY

      - name: .ps1 с кириллицей должны быть UTF-8 с BOM
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.ps1'):
              if 'node_modules' in p.parts:
                  continue
              data = p.read_bytes()
              if any(b > 127 for b in data) and not data.startswith(b'\xef\xbb\xbf'):
                  bad.append(str(p))
          if bad:
              print('без BOM — Windows PowerShell 5.1 прочитает файл как ANSI и сломается:', *bad, sep='\n  ')
              sys.exit(1)
          print('BOM на месте')
          PY
