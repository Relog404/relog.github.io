// ============================================================
//  CS2 Dedicated Server — базовый конфиг
//  Лежит здесь: <game>/game/csgo/cfg/server.cfg
//  Установщик сам копирует его и подставляет RCON-пароль.
// ============================================================

// --- Имя и доступ ---
hostname "Relog CS2 #1"
rcon_password "changeme_rcon_password"   // установщик заменит на сгенерированный
sv_password ""                            // пусто = сервер без пароля

// --- Сеть ---
sv_lan 0            // 1 = только локальная сеть (без GSLT)
sv_region 3         // 255 = весь мир, 3 = Европа
sv_cheats 0
sv_hibernate_when_empty 0

// --- Матч (классический соревновательный формат) ---
mp_maxrounds 24
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_freezetime 15
mp_buytime 20
mp_startmoney 800
mp_maxmoney 16000
mp_c4timer 40
mp_halftime 1
mp_halftime_duration 15
mp_overtime_enable 1
mp_warmup_pausetimer 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 1
mp_solid_teammates 1
mp_forcecamera 1
sv_talk_enemy_dead 0
sv_talk_enemy_living 0
mp_death_drop_gun 1
mp_death_drop_defuser 1
mp_defuser_allocation 0
mp_weapons_allow_zeus 1
mp_weapons_allow_typecount 5   // лимит одинаковых винтовок (AWP, SG553, AUG)

// --- Боты (0 = выключены) ---
bot_quota 0
bot_difficulty 2
bot_join_after_player 0

// --- Логи ---
log on
sv_logecho 1
sv_log_onefile 0
sv_logfile 1

// --- GOTV (раскомментируйте, если нужны записи/трансляция) ---
// tv_enable 1
// tv_delay 60
// tv_autorecord 1
// tv_maxclients 10

echo "server.cfg загружен"
