// ============================================================
//  CS2 выполняет этот файл СРАЗУ ПОСЛЕ gamemode_competitive.cfg,
//  поэтому именно здесь перебиваем то, что Valve ставит сама
//  (боты, лимиты команды). Кладётся в <game>/game/csgo/cfg/
// ============================================================

// --- Боты: Valve включает их в своем конфиге, убираем обратно ---
bot_quota 0
bot_quota_mode normal
bot_join_after_player 0
bot_join_team any
bot_autodifficulty_threshold 0
bot_difficulty 2

// --- Баланс команд ---
mp_autoteambalance 1
mp_limitteams 1
mp_forcecamera 1

// --- Разминка и раунды ---
mp_warmup_enabled 1
mp_warmup_pausetimer 0
mp_halftime 1
mp_maxrounds 24

echo "gamemode_competitive_server.cfg загружен"
