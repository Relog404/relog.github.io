# Пример обратного прокси для CS2 Panel.
# Скопируйте в /etc/nginx/sites-available/cs2-panel и сделайте symlink в sites-enabled.
# Не забудьте указать PUBLIC_BASE_URL=https://panel.example.com в .env — иначе Steam OpenID не сработает.

server {
    listen 80;
    server_name panel.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS включите через certbot:
#   sudo certbot --nginx -d panel.example.com
#
# Дополнительно recommended: ограничьте /api/admin/* и /api/console по IP:
# location /api/admin/ { allow 203.0.113.0/24; deny all; proxy_pass http://127.0.0.1:3000; }
